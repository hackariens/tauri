name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TAURI_CACHE: ~/.cache/tauri
  CARGO_HOME: ~/.cargo

jobs:
  lint:
    name: Lint & Quality Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: 'package-lock.json'
      
      - name: Setup Task
        uses: go-task/setup-task@v1

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Lint all
        run: task lint:all

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: 'package-lock.json'
      
      - name: Setup Task
        uses: go-task/setup-task@v1

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: create Apps
        run: task create:apps

      - name: Install dependencies
        run: |
          npm install
          cd apps
          npm install

  build:
    name: Build Tauri App
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: win
          - os: macos-26
            platform: mac

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: 'package-lock.json'
      
      - name: Setup Task
        uses: go-task/setup-task@v1

      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: create Apps
        run: task create:apps

      - name: Install dependencies
        run: |
          npm install
          cd apps
          npm install
      

      - name: Build Tauri app
        run: |
          cd apps
          npm run tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tauri-app-${{ matrix.platform }}-${{ github.sha }}
          path: apps/src-tauri/target/release/
          retention-days: 1